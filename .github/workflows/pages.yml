name: Deploy Scientific programming course site

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Prepare site files
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git -c http.extraheader="AUTHORIZATION: bearer ${GITHUB_TOKEN}" clone --depth 1 "https://github.com/${GITHUB_REPOSITORY}.git" source
          test -f source/site/index.html
          test -f source/site/data.json
          rm -rf public
          mkdir public
          cp -R source/site/. public/
          touch public/.nojekyll

      - name: Publish gh-pages branch
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd public
          git init
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "Deploy site from ${GITHUB_SHA}"
          git branch -M gh-pages
          git -c http.extraheader="AUTHORIZATION: bearer ${GITHUB_TOKEN}" push --force "https://github.com/${GITHUB_REPOSITORY}.git" gh-pages